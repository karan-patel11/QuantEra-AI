/* architecture matrix */

/* lens terminal */
.term { border-radius: 22px; overflow: hidden; }

.term-body { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }

.lg { position: absolute; left: 16px; top: 44px; z-index: 2; pointer-events: none; display: flex; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--muted); flex-wrap: wrap; justify-content: flex-end; }

.qe textarea { width: 100%; min-height: 136px; background: rgba(255, 255, 255, 0.5); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); font: 13px/1.6 'IBM Plex Mono', monospace; padding: 14px; resize: vertical; }

.payload { font: 12px/1.75 'IBM Plex Mono', monospace; color: var(--muted); background: rgba(62, 62, 60, 0.06); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow-x: auto; white-space: nowrap; }
.payload .pk { color: var(--vi2); }
.payload .pv { color: var(--text); }
.gv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); }
.gv b { font-weight: 600; font-size: 14.5px; }

.gbadge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 5px 10px; border-radius: 7px; font-weight: 600; }

.gbadge.fail { color: #9E2A22; background: rgba(158, 42, 34, 0.08); border: 1px solid rgba(158, 42, 34, 0.4); }

.status.ok { background: rgba(133, 187, 101, 0.2); border: 1px solid rgba(34, 141, 87, 0.4); }

/* reveal */

<div class="bg-spot" data-q="spot" aria-hidden="true"></div>

<span class="wm">QuantEra</span><span class="wm-sub">Research Lab</span>
</a>
<div class="nav-links">
<a href="#run">How it runs</a>
<a href="#architecture">Architecture</a>
<a href="#lens">Try the guards</a>
<a href="#building">What I'm building</a>
<a href="#gaps">Known gaps</a>
</div>

</nav>

<div class="tape-tag mono"><span class="dot c"></span><span>AT A GLANCE</span></div>

<sc-for list="{{ tape }}" as="t" hint-placeholder-count="12">

</sc-for>
</div>
</div>
</header>

<main class="main">

<section class="hero wrap" id="top">
<div class="hero-copy">
<p class="eyebrow mono rv">QUANTERA · AI EQUITY RESEARCH</p>
<h1 class="rv" style="--d: 80ms">Stock research by AI agents, <span class="grad">verified by code.</span></h1>
<p class="lede rv" style="--d: 160ms">Specialist agents analyze a company, code computes every number, and a checker blocks anything it can't trace to a filing or price.</p>
<div class="cta rv" style="--d: 240ms">
<a class="btn btn-primary" href="#run">Play the run</a>
<a class="nav-gh" href="https://github.com/karan-patel11/QuantEra-AI/tree/archive/v0-code">View the source <span aria-hidden="true">→</span></a>
</div>
<p class="hero-meta rv" style="--d: 300ms">3 lenses live · 8 agents designed · Built and audited by <a href="https://github.com/karan-patel11">Karan Patel</a></p>
</div>

<div class="rv" style="--d: 200ms">
<div class="hero-viz glass screen">
<canvas class="gl" data-q="hero-c" role="img" aria-label="3D chart of seven sample stocks over 72 trading days, cut by a moving line for the research date. Days after the line are blocked because that information was not public yet."></canvas>
<span class="corner k1"></span><span class="corner k2"></span><span class="corner k3"></span><span class="corner k4"></span>
<div class="hud hud-tl">
RESEARCH DATE
<span class="big">{{ asOfDate }}</span>
<span class="row"><span class="st-i">{{ visCount }} VISIBLE</span><span class="st-d">{{ gatedCount }} BLOCKED</span></span>
</div>
<div class="{{ hovTipCls }}" data-q="htip" aria-hidden="true">
<div class="tt"><span>{{ hov.ent }}</span><span>{{ hov.date }}</span></div>
<div class="kv"><span>OPEN</span><span>{{ hov.o }}</span></div>
<div class="kv"><span>HIGH</span><span>{{ hov.h }}</span></div>
<div class="kv"><span>LOW</span><span>{{ hov.l }}</span></div>
<div class="kv"><span>CLOSE</span><span>{{ hov.c }}</span></div>
<div class="kv"><span>CHANGE</span><span class="{{ hov.chgCls }}">{{ hov.chg }}</span></div>

</div>

</div>

</sc-if>
</div>
<p class="viz-cap">Each bar is a trading day. QuantEra only sees what was public on the research date, so everything past the line is blocked. Sample data.</p>
</div>
</section>

<section class="wrap" aria-label="Audited results">
<div class="stats">
<div class="stat glass rv">

<section class="sec wrap" aria-labelledby="principles-title">
<div class="sec-head">
<div class="rv">
<div class="kicker"><span class="dot c"></span>DESIGN PRINCIPLES</div>
<h2 id="principles-title">LLMs reason. Code calculates and verifies.</h2>
</div>
<p class="sec-sub rv" style="--d: 100ms">AI research tools fail in three ways: they peek at data that wasn't public yet, quote numbers nobody can trace, and add complexity without proof. QuantEra is designed around all three.</p>
</div>
<div class="g3">
<div class="card glass rv" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<span class="idx-n">01</span>
<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"></path><path d="m16 15 2 2 4-4"></path></svg></div>
<h3>LLMs reason; code calculates</h3>
<p>The model picks the method and the inputs. Deterministic Python produces every number.</p>
</div>
<div class="card glass rv" style="--d: 70ms" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<span class="idx-n">02</span>
<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg></div>
<h3>Point-in-time by construction</h3>
<p>Every fact carries the timestamp it became tradable, and the data interface enforces an as-of date on every query.</p>
</div>
<div class="card glass rv" style="--d: 140ms" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<span class="idx-n">03</span>
<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></div>
<h3>Every claim is source-linked</h3>
<p>Each claim cites the fact rows and filing accession numbers it depends on.</p>
</div>
<div class="card glass rv" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<span class="idx-n">04</span>
<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v6c0 4.4 3.2 7.8 7.5 9 4.3-1.2 7.5-4.6 7.5-9V6L12 3Z"></path><path d="m9 12 2 2 4-4"></path></svg></div>
<h3>Independent verification</h3>
<p>A separate checker, not the authoring agent, validates citations, timing and math.</p>
</div>
<div class="card glass rv" style="--d: 70ms" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<span class="idx-n">05</span>

<h3>Reproducible runs</h3>
<p>Every output records its data snapshot, prompt version, model ID and code commit.</p>
</div>
<div class="card glass rv" style="--d: 140ms" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<span class="idx-n">06</span>
<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></div>
<h3>Prove it against baselines</h3>
<p>Probabilistic forecasts, proper scoring rules, walk-forward testing, and comparison with single-agent and no-LLM baselines.</p>
</div>
</div>

<h2 id="lens-title">Try to fool the guards</h2>
</div>
<p class="sec-sub rv" style="--d: 100ms">The AI writes the summary, but code checks it first: every number must come from real data, every link from a retrieved source, and nothing may read like advice. Add a made-up figure or the word "buy" and watch it fail.</p>
</div>
<div class="guard" style="margin-top: 0">
<div class="panel glass rv">
<div class="ptitle"><span>STEP 1 · THE AI'S DRAFT</span><span class="badge">EXAMPLE DATA</span></div>

<div class="render"><sc-for list="{{ segs }}" as="g" hint-placeholder-count="5"><span class="{{ g.cls }}">{{ g.t }}</span></sc-for></div>
<span class="flab">THE ONLY FACTS THE AI WAS GIVEN</span>
<div class="payload">
<div><span class="pk">net_margin_pct</span>: <span class="pv">24.3</span>   <span class="pk">pe_ratio</span>: <span class="pv">28.4</span>   <span class="pk">revenue_growth</span>: <span class="pv">UNAVAILABLE</span></div>
<div><span class="pk">rsi_14</span>: <span class="pv">61.2</span>   <span class="pk">vol_30d_pct</span>: <span class="pv">21.8</span>   <span class="pk">return_3m_pct</span>: <span class="pv">7.4</span>   <span class="pk">news_tone</span>: <span class="pv">MIXED</span></div>
<div><span class="pk">sources</span>: <span class="pv">[Reuters](https://www.reuters.com/markets/example-q4-results)</span>, <span class="pv">[SEC](https://www.sec.gov/example-10-k-filing)</span></div>
</div>
</div>
<div class="panel glass rv" style="--d: 80ms" aria-live="polite">

<div class="gaps">

<div class="gtag"><span>GAP 01</span><span>→ ROADMAP 2</span></div>
<h3>Orchestration is one sequential Python function.</h3>

</div>
<div class="card glass rv" style="--d: 70ms" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<div class="gtag"><span>GAP 02</span><span>→ ROADMAP 1</span></div>
<h3>5 of 14 fundamentals metrics can never produce a value.</h3>
<p>Two ratios lack contract fields and the three growth metrics are hard-coded unavailable. Growth is the cheapest fix.</p>
</div>
<div class="card glass rv" style="--d: 140ms" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<div class="gtag"><span>GAP 03</span><span>→ ROADMAP 3</span></div>
<h3>Grounding checks values, not claims.</h3>
<p>A real number attached to the wrong metric still passes. Planned: bind each number to the field it describes.</p>
</div>
<div class="card glass rv" onMouseMove="{{ tilt }}" onMouseLeave="{{ untilt }}">
<div class="gtag"><span>GAP 04</span><span>→ ROADMAP 1</span></div>
<h3>Tests pass locally, but nothing runs them automatically.</h3>
<p>90 tests pass, but the only workflow deploys this page. A pytest job on pull requests is a few lines.</p>
</div>
