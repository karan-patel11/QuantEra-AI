[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantera"
version = "0.1.0"
description = "Data foundation and fundamentals lens for QuantEra Research Lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.52.0",
  "fastapi>=0.115.0",
  "groq>=0.13.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.30.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["quantera"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
markers = [
  "integration: tests that hit live external services",
]
